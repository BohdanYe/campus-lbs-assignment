{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Campus Services & Accessibility Finder</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/app.css' %}"
    >
</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            Campus Services & Accessibility Finder
        </span>

        <a
            href="/api/places/"
            class="btn btn-outline-light btn-sm"
            target="_blank"
        >
            REST API
        </a>
    </div>
</nav>

<main class="container-fluid py-3">

    <div class="row g-3">

        <aside class="col-12 col-lg-3">

            <div class="card shadow-sm mb-3">
                <div class="card-body">

                    <h5 class="card-title">
                        Map Layers
                    </h5>

                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="showPlaces"
                            checked
                        >
                        <label
                            class="form-check-label"
                            for="showPlaces"
                        >
                            Places
                        </label>
                    </div>

                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="showRoutes"
                            checked
                        >
                        <label
                            class="form-check-label"
                            for="showRoutes"
                        >
                            Routes
                        </label>
                    </div>

                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="showZones"
                            checked
                        >
                        <label
                            class="form-check-label"
                            for="showZones"
                        >
                            Zones
                        </label>
                    </div>

                </div>
            </div>


            <div class="card shadow-sm mb-3">
                <div class="card-body">

                    <h5 class="card-title">
                        Filter Places
                    </h5>

                    <label
                        for="categoryFilter"
                        class="form-label"
                    >
                        Category
                    </label>

                    <select
                        id="categoryFilter"
                        class="form-select mb-3"
                    >
                        <option value="">
                            All categories
                        </option>

                        <option value="academic">
                            Academic Building
                        </option>

                        <option value="library">
                            Library
                        </option>

                        <option value="student_services">
                            Student Services
                        </option>

                        <option value="health">
                            Health Service
                        </option>

                        <option value="sports">
                            Sports Facility
                        </option>

                        <option value="cafe">
                            Cafe / Catering
                        </option>

                        <option value="study">
                            Study Area
                        </option>

                        <option value="accessibility">
                            Accessibility Service
                        </option>

                        <option value="transport">
                            Transport
                        </option>

                        <option value="heritage">
                            Heritage / Landmark
                        </option>

                        <option value="community">
                            Community Facility
                        </option>

                        <option value="other">
                            Other
                        </option>
                    </select>

                    <div class="form-check mb-3">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="accessibleOnly"
                        >

                        <label
                            class="form-check-label"
                            for="accessibleOnly"
                        >
                            Accessible facilities only
                        </label>
                    </div>

                    <button
                        id="applyPlaceFilter"
                        class="btn btn-primary w-100"
                    >
                        Apply Filter
                    </button>

                </div>
            </div>


            <div class="card shadow-sm mb-3">
                <div class="card-body">

                    <h5 class="card-title">
                        Location Search
                    </h5>

                    <p class="small text-muted">
                        Click anywhere on the map to select
                        a search location.
                    </p>

                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label
                                for="searchLat"
                                class="form-label"
                            >
                                Latitude
                            </label>

                            <input
                                id="searchLat"
                                type="number"
                                step="any"
                                class="form-control"
                                readonly
                            >
                        </div>

                        <div class="col-6">
                            <label
                                for="searchLng"
                                class="form-label"
                            >
                                Longitude
                            </label>

                            <input
                                id="searchLng"
                                type="number"
                                step="any"
                                class="form-control"
                                readonly
                            >
                        </div>
                    </div>


                    <label
                        for="nearestLimit"
                        class="form-label"
                    >
                        Number of nearest places
                    </label>

                    <input
                        id="nearestLimit"
                        type="number"
                        class="form-control mb-2"
                        value="5"
                        min="1"
                        max="50"
                    >

                    <button
                        id="findNearest"
                        class="btn btn-success w-100 mb-3"
                    >
                        Find Nearest Places
                    </button>


                    <label
                        for="radiusInput"
                        class="form-label"
                    >
                        Search radius (metres)
                    </label>

                    <input
                        id="radiusInput"
                        type="number"
                        class="form-control mb-2"
                        value="150"
                        min="1"
                        max="10000"
                    >

                    <button
                        id="findRadius"
                        class="btn btn-info w-100 mb-2"
                    >
                        Search Within Radius
                    </button>


                    <button
                        id="findZone"
                        class="btn btn-warning w-100 mb-2"
                    >
                        Find Containing Zone
                    </button>

                    <hr>

                    <label
                        for="zoneSelect"
                        class="form-label"
                    >
                        Route intersection zone
                    </label>

                    <select
                        id="zoneSelect"
                        class="form-select mb-2"
                    >
                        <option value="">
                            Select a zone
                        </option>
                    </select>

                    <button
                        id="findIntersectingRoutes"
                        class="btn btn-dark w-100 mb-2"
                    >
                        Find Routes Through Zone
                    </button>


                    <button
                        id="resetSearch"
                        class="btn btn-outline-secondary w-100"
                    >
                        Reset Search
                    </button>

                </div>
            </div>


            <div class="card shadow-sm">
                <div class="card-body">

                    <h5 class="card-title">
                        Results
                    </h5>

                    <div id="resultsMessage">
                        No spatial search performed yet.
                    </div>

                    <div
                        id="resultsList"
                        class="mt-2"
                    ></div>

                </div>
            </div>

        </aside>


        <section class="col-12 col-lg-9">

            <div class="card shadow-sm">

                <div class="card-body p-2">

                    <div id="map"></div>

                </div>

            </div>


            <div class="row g-3 mt-1">

                <div class="col-4">
                    <div class="summary-card">
                        <div class="summary-number" id="placeCount">
                            0
                        </div>
                        <div>
                            Places
                        </div>
                    </div>
                </div>

                <div class="col-4">
                    <div class="summary-card">
                        <div class="summary-number" id="routeCount">
                            0
                        </div>
                        <div>
                            Routes
                        </div>
                    </div>
                </div>

                <div class="col-4">
                    <div class="summary-card">
                        <div class="summary-number" id="zoneCount">
                            0
                        </div>
                        <div>
                            Zones
                        </div>
                    </div>
                </div>

            </div>

        </section>

    </div>

</main>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script
    src="{% static 'js/map.js' %}"
></script>

</body>
</html>
